# Production stack for a home server (your PC, or later a VPS): PostgreSQL, the app and a Cloudflare Tunnel.
#
# Nothing is opened on the router: cloudflared makes an outbound connection to Cloudflare, which serves
# the site on your domain with HTTPS and forwards each request to the `web` service. Names, volumes and
# ports differ from docker-compose.yml, so this stack and the development one can run on the same PC.
#
# Do not start it by hand; scripts/update-server.sh builds, starts and health-checks it.
# Step-by-step setup: docs/09-deploy.md.
name: canhoes-server

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: canhoes-server-postgres
    restart: always
    environment:
      POSTGRES_DB: canhoes
      POSTGRES_USER: canhoes
      # Only read when the volume is created; changing it later does not change the database password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No published port: only the app reaches the database, through the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U canhoes -d canhoes"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: canhoes-server-web
    container_name: canhoes-server-web
    restart: always
    env_file:
      - .env.server
    environment:
      DATABASE_URL: "postgresql://canhoes:${POSTGRES_PASSWORD}@postgres:5432/canhoes?schema=public"
      # Cloudflare terminates HTTPS; NextAuth builds its URLs from the forwarded host.
      AUTH_TRUST_HOST: "true"
    # Reachable only from this machine, for the health check in scripts/update-server.sh.
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  tunnel:
    # Cloudflare stops supporting cloudflared releases after a year, so this follows the latest one.
    image: docker.io/cloudflare/cloudflared:latest
    container_name: canhoes-server-tunnel
    restart: always
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Created in the Cloudflare dashboard; its public hostname points to http://web:3000.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  postgres_data:
  uploads:
