services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: canhoes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canhoes}
      POSTGRES_USER: ${POSTGRES_USER:-canhoes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canhoes_local}
    ports:
      - "5433:5432"
    volumes:
      - canhoes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-canhoes} -d ${POSTGRES_DB:-canhoes}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canhoes-web
    restart: always
    ports:
      # Tailscale Funnel terminates public HTTPS and forwards to this local port.
      - "127.0.0.1:3100:3000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database is the "postgres" service.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-canhoes}:${POSTGRES_PASSWORD:-canhoes_local}@postgres:5432/${POSTGRES_DB:-canhoes}?schema=public"
      # Let NextAuth build URLs from the forwarded host when opened through a proxy or tunnel.
      AUTH_TRUST_HOST: "true"
      # Public origin for NextAuth redirects; comes from --env-file (.env.server), else .env.
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
    volumes:
      - canhoes_uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  https:
    image: docker.io/library/caddy:2-alpine
    container_name: canhoes-https
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certificates:/etc/caddy/certificates:ro
      - canhoes_caddy_data:/data
      - canhoes_caddy_config:/config
    depends_on:
      - web

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: canhoes-server-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    env_file:
      - .env.server
    depends_on:
      - web

volumes:
  canhoes_postgres_data:
  canhoes_uploads:
  canhoes_caddy_data:
  canhoes_caddy_config:
