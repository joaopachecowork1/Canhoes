name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://canhoes:placeholder@localhost:5432/canhoes?schema=public
  NEXTAUTH_SECRET: ci-build-secret

jobs:
  checks:
    name: Lint, types, tests, knip, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:component
      - run: npm run knip
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
