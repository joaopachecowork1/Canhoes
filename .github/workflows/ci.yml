name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests, knip, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:component
      - run: npm run knip
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration and authorization tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: canhoes_test
          POSTGRES_USER: canhoes
          POSTGRES_PASSWORD: canhoes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canhoes -d canhoes_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://canhoes:canhoes_ci@localhost:5432/canhoes_test?schema=public
    steps:
      - uses: actions/checkout@v5
        with:
          # SonarQube needs the full history to tell new code from old.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit, component and integration tests in one run, so coverage counts all three; it fails
      # below the thresholds in vitest.config.mjs. Only this job has PostgreSQL.
      - run: npm run test:coverage
      - name: SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  local-setup:
    # The README steps on a clean machine, with each engine: PostgreSQL from docker-compose.yml,
    # migrations, seed and the integration tests, then the whole stack in containers.
    name: Local setup (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      CONTAINER_ENGINE: ${{ matrix.engine }}
      # Ignored by Docker; without it `podman compose` picks the runner's docker-compose plugin.
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install podman-compose
        if: matrix.engine == 'podman'
        run: pipx install podman-compose
      - run: npm ci
      - name: Write .env
        run: |
          cp .env.example .env
          sed -i "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$(openssl rand -base64 32)|" .env
      - run: npm run db:up
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - name: Whole stack in containers
        # The app and its database. The `https` (Caddy, needs local certificates) and `tunnel`
        # (needs a Cloudflare token) services only make sense on the home PC, so they are not
        # started; compose still reads the tunnel's .env.server, hence the empty one.
        run: |
          touch .env.server
          $CONTAINER_ENGINE compose up -d --build postgres web
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3100/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: $CONTAINER_ENGINE compose logs || true

  docker:
    name: Docker image, migrations and OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: canhoes
          POSTGRES_USER: canhoes
          POSTGRES_PASSWORD: canhoes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canhoes -d canhoes"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: canhoes:ci
          # Layer cache between runs, so unchanged dependencies are not reinstalled.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the app (applies migrations and seeds)
        run: |
          docker run -d --name canhoes --network host \
            -e DATABASE_URL="postgresql://canhoes:canhoes_ci@localhost:5432/canhoes?schema=public" \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e NEXTAUTH_SECRET=ci-only-secret \
            -e ADMIN_EMAILS=admin@example.com \
            canhoes:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs canhoes
          exit 1
      - name: Check that the production seed left out the demo data
        run: |
          users=$(psql "postgresql://canhoes:canhoes_ci@localhost:5432/canhoes" -tAc 'SELECT count(*) FROM "Users"')
          echo "Users after seeding: $users"
          test "$users" = 1
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000/canhoes/login
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          allow_issue_writing: false
          # Fails on any alert not triaged in .zap/rules.tsv.
          fail_action: true
      - name: Container logs
        if: always()
        run: docker logs canhoes || true

  home-server:
    name: Home server deploy (compose.server.yml and update script)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # The update script fast-forwards to origin/main, which needs the full history.
          fetch-depth: 0
      - name: Write .env.server
        run: |
          cat > .env.server <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          NEXTAUTH_URL=http://127.0.0.1:3100
          NEXTAUTH_SECRET=ci-only-secret
          ADMIN_EMAILS=admin@example.com
          CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder
          EOF
      - name: First install
        run: scripts/update-server.sh --force
      - name: Redeploy keeps the data and backs it up first
        run: |
          scripts/update-server.sh --force
          ls backups/canhoes-server-*.dump
          users=$(docker exec canhoes-server-postgres psql -U canhoes -d canhoes -tAc 'SELECT count(*) FROM "Users"')
          echo "Users after two deploys: $users"
          test "$users" = 1
      - name: Container logs
        if: always()
        run: docker compose -p canhoes-server -f compose.server.yml --env-file .env.server logs web || true
